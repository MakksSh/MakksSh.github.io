    - name: "DDTokens"
      url: "https://ddtnew.com"
      registration: "Свободная"
      payment: "СБП, Крипта, Ин. карты"
      conditions: "PAYG"
      models: "Claude, GPT, Gemini, китайцы и другие"
      embeddings: "Нет"
      stability: "Стабильный. Могут быть кратковременные проблемы по отдельным группам моделей"
      note: "Молодой китайский прокси. Огромный плюс - облата через СБП. Есть велком бонус 5 юаней. Есть возможность прямого контакта с владельцем в ТГ."
    - name: "Link API"
      url: "https://linkapi.ai/"
      registration: "Свободная"
      payment: "Ин. карты, посредники"
      conditions: "PAYG"
      models: "Claude, GPT, Gemini, китайцы и другие"
      embeddings: "Есть"
      stability: "Стабильный. Могут быть кратковременные проблемы по отдельным группам моделей"
      note: "Достаточно известный китайский прокси. У некоторых моделей есть фикс оплата за запрос без учёта токенов."

