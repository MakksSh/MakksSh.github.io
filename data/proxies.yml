- category: "Green"
  items:
    - name: "Rout My"
      url: "https://rout.my"
      registration: "Свободная. Покупки новых подписок могут приостановить при наплывах/проблемах"
      payment: "Boosty, Patreon, Крипта"
      conditions: "Подписка с квотой"
      models: "Claude, GPT, Gemini, китайцы и другие"
      embeddings: "Есть"
